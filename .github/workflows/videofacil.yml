name: Rodar VideoFacil Automatico

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Atualizar pip e ferramentas base
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependencias do requirements.txt
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script videofacil cloud com caminho absoluto
        working-directory: /home/runner/work/soundxfix-ia/soundxfix-ia
        run: |
          python videofacil_cloud.py
