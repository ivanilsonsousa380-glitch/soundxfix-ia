name: Rodar VideoFacil Automatico

on:
  workflow_dispatch:

# Garante permissões completas para o robô ler e escrever no repositório se precisar
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Atualizar pip e ferramentas base
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependencias do requirements.txt
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Diagnostico rapido do ambiente
        run: |
          echo "--- DIRETORIO ATUAL ---"
          pwd
          echo "--- LISTA DE FICHEIROS NA RAIZ ---"
          ls -la
          echo "--- VERSAO DO PYTHON ---"
          python --version

      - name: Executar script videofacil cloud de forma direta
        run: |
          python ./videofacil_cloud.py
